[package]
name = "timew-rs"
version = "0.2.0"
edition = "2024"
description = "A Rust implementation of Timewarrior: the timew_rs library and the timew-cli command"

[[bin]]
name = "timew-cli"
path = "src/main.rs"

[dependencies]
jiff = "0.2.42"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
unicode-width = "0.2.3"
